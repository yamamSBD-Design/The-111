<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aethel Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700&family=Rajdhani:wght@300;500;700&display=swap');
      
      body {
        background-color: #000;
        color: #e0e0e0;
        font-family: 'Rajdhani', sans-serif;
        overflow: hidden;
      }
      
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Custom Scrollbar for Brutalist feel */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #22d3ee;
      }

      .glitch-text {
        position: relative;
        animation: glitch 1s infinite;
      }

      @keyframes glitch {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
        100% { transform: translate(0); }
      }

      .scan-line {
        width: 100%;
        height: 2px;
        background: rgba(34, 211, 238, 0.8);
        position: absolute;
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.8);
        animation: scan 3s linear infinite;
      }

      @keyframes scan {
        0% { top: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }

      /* Visual Feedback Animation */
      @keyframes float-out {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        50% { opacity: 1; }
        100% { transform: translateY(-60px) scale(1.1); opacity: 0; }
      }

      .animate-float {
        animation: float-out 2s ease-out forwards;
      }
    </style>

  }
}
</script>

    <div id="root"></div>
  </body>
</html>
